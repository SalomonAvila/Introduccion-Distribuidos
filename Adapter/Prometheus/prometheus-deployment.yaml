apiVersion: v1
kind: Pod
metadata:
  name: prometheus-stack
  namespace: default
  labels:
    app: monitoring
spec:
  containers:
  - name: redis
    image: redis:latest
    ports:
    - containerPort: 6379
  
  - name: redis-exporter
    image: oliver006/redis_exporter:latest
    ports:
    - containerPort: 9121
    env:
    - name: REDIS_ADDR
      value: "localhost:6379"
  
  - name: prometheus
    image: prom/prometheus:latest
    ports:
    - containerPort: 9090
    volumeMounts:
    - name: prometheus-config
      mountPath: /etc/prometheus
    args:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
  
  volumes:
  - name: prometheus-config
    configMap:
      name: prometheus-config
