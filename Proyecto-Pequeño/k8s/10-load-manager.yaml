apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-manager
  namespace: biblioteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-manager
  template:
    metadata:
      labels:
        app: load-manager
    spec:
      containers:
      - name: load-manager
        image: biblioteca/load-manager:latest
        imagePullPolicy: Never
        env:
        - name: GC_CLIENT_BIND
          value: tcp://*:5555
        - name: GC_PUB_BIND
          value: tcp://*:5556
        - name: ACTOR_PRESTAMO_ENDPOINT
          value: tcp://actor-prestamo:5557
        ports:
        - containerPort: 5555
        - containerPort: 5556
---
apiVersion: v1
kind: Service
metadata:
  name: load-manager
  namespace: biblioteca
spec:
  selector:
    app: load-manager
  ports:
  - name: ps-reqrep
    protocol: TCP
    port: 5555
    targetPort: 5555
  - name: pub-events
    protocol: TCP
    port: 5556
    targetPort: 5556
